# Builds the golf course catalogue and the tennis venue catalogue from
# OpenStreetMap and publishes them to Cloudflare R2 (served at
# https://data.lyjaapp.eu/golf/ and /tennis/). See README.md.
#
# Each region is downloaded once for both. The tennis steps never stop golf:
# they may fail on their own in the extract job, and a tennis build with a
# region missing is never published.
#
# Monthly, plus by hand. Each region is downloaded, filtered and reduced in a
# job of its own (one big download at a time per runner, deleted at once);
# one job then merges them, checks the result against the live build and
# publishes, the manifest last. A failed download or a failed check publishes
# nothing and the last good build stays live.
name: Golf catalogue

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Regex on Geofabrik paths to build, e.g. 'lithuania|latvia'. Empty builds everything; a partial build is never published."
        required: false
        default: ""
      publish:
        description: "Publish to R2 (full builds only)"
        type: boolean
        default: true
      tennis_from_run:
        description: "Tennis only: the run ID whose tennis extracts to build and publish (kept 7 days). Skips the downloads and golf."
        required: false
        default: ""
      tennis_build_id:
        description: "Tennis only, with tennis_from_run: resume this interrupted build ID (e.g. 2026-11-12T1943Z) built from the same extracts; files already in R2 are skipped."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: golf-catalogue
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          echo "matrix=$(python -m golf_catalogue.plan ${ONLY:+--only "$ONLY"})" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    if: inputs.tennis_from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: extract ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Tools
        run: |
          sudo apt-get install -y -q osmium-tool >/dev/null
          pip install -q "$(grep '^osmium==' requirements.txt)" "$(grep '^shapely==' requirements.txt)"
      - name: Download ${{ matrix.url }}
        env:
          URL: ${{ matrix.url }}
        run: |
          # Geofabrik republishes its extracts daily; while a region is being
          # swapped the file can 404 for a few minutes, so a failed download
          # is tried again after a pause. The checksum is checked where
          # Geofabrik has one (Germany's .md5 404s); without it, osmium's
          # read in the next step is what catches a broken file.
          for attempt in 1 2 3 4; do
            if curl -fsSL --retry 5 --retry-delay 30 -o region.osm.pbf "$URL"; then
              if curl -fsSL --retry 3 --retry-delay 10 -o region.md5 "$URL.md5"; then
                if echo "$(cut -d' ' -f1 region.md5)  region.osm.pbf" | md5sum -c -; then
                  ls -lh region.osm.pbf
                  exit 0
                fi
              else
                echo "::warning::No checksum for $URL; relying on osmium to read the file."
                ls -lh region.osm.pbf
                exit 0
              fi
            fi
            echo "Attempt $attempt failed; waiting before the next."
            rm -f region.osm.pbf region.md5
            sleep $((attempt * 300))
          done
          exit 1
      - name: Filter
        run: |
          echo "TIMESTAMP=$(osmium fileinfo -g header.option.timestamp region.osm.pbf || true)" >> "$GITHUB_ENV"
          osmium tags-filter region.osm.pbf nwr/leisure=golf_course nwr/golf r/type=sport -o golf.osm.pbf --overwrite
      - name: Filter for tennis
        id: tennis_filter
        continue-on-error: true
        run: |
          # The racket-sport pitches and what can hold them; then, near those
          # pitches only, buildings, residential land, parks, roads and water.
          osmium tags-filter region.osm.pbf nwr/sport=tennis,padel,pickleball \
            nwr/leisure=pitch,practice_pitch,sports_centre,sports_hall,stadium nwr/club=sport \
            -o racket.osm.pbf --overwrite
          python -m tennis_catalogue.boxes racket.osm.pbf --out boxes.geojson
          if [ -f boxes.geojson ]; then
            osmium tags-filter region.osm.pbf nwr/building nwr/landuse=residential,recreation_ground nwr/leisure=park \
              w/highway=primary,secondary,tertiary,residential w/waterway=river,canal,stream \
              -o context.osm.pbf --overwrite
            osmium extract -p boxes.geojson -s smart context.osm.pbf -o near.osm.pbf --overwrite
            rm context.osm.pbf
          fi
      - name: Free the download
        run: rm -f region.osm.pbf
      - name: Extract
        run: python -m golf_catalogue.extract golf.osm.pbf --region "${{ matrix.id }}" --country "${{ matrix.country }}" --timestamp "$TIMESTAMP" --out "raw/${{ matrix.id }}.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.id }}
          path: raw/
          retention-days: 7
      - name: Extract tennis
        # Without the surroundings pass, indoor courts would pass as outdoor:
        # no extract then, and the tennis build is incomplete and unpublished.
        if: steps.tennis_filter.outcome == 'success'
        continue-on-error: true
        run: python -m tennis_catalogue.extract racket.osm.pbf near.osm.pbf --region "${{ matrix.id }}" --country "${{ matrix.country }}" --timestamp "$TIMESTAMP" --out "raw-tennis/${{ matrix.id }}.json.gz"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tennis-raw-${{ matrix.id }}
          path: raw-tennis/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: [plan, extract]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: raw
      - name: Build
        run: python -m golf_catalogue.build raw out
      - name: Check against the live build
        run: |
          curl -fsSL -o previous.json https://data.lyjaapp.eu/golf/v1/manifest.json || rm -f previous.json
          python -m golf_catalogue.guard out/stats.json --previous previous.json
      - name: Summary
        if: always()
        run: |
          [ -f out/stats.json ] || exit 0
          minutes=$(( ( $(date +%s) - ${{ needs.plan.outputs.started }} ) / 60 ))
          python -m golf_catalogue.summary out --minutes "$minutes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report
          path: |
            out/stats.json
            out/build-log.json
          retention-days: 90
      - name: Publish to R2
        if: inputs.only == '' && inputs.publish != false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'lyja-golf' }}
        run: |
          tar -czf ../golf-catalogue.tar.gz --exclude='./raw' --exclude='./out' --exclude='__pycache__' --exclude='./.git' .
          python -m golf_catalogue.publish out --tools ../golf-catalogue.tar.gz

  tennis:
    needs: [plan, extract]
    # Runs after a full extract, or alone on an earlier run's extracts.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.extract.result == 'success' || inputs.tennis_from_run != '') }}
    runs-on: ubuntu-24.04
    # Some 230,000 venue files to upload.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        if: inputs.tennis_from_run == ''
        with:
          pattern: tennis-raw-*
          merge-multiple: true
          path: raw-tennis
      - name: Download an earlier run's tennis extracts
        # download-artifact lists only the first 200 of another run's
        # artifacts (a full run has some 250); gh reads every page.
        if: inputs.tennis_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.tennis_from_run }}
        run: |
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --pattern 'tennis-raw-*' --dir dl
          mkdir -p raw-tennis
          find dl -name '*.json.gz' -exec mv -t raw-tennis {} +
      - name: Every region in?
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          expected=$(python -c "import json, os; print(len(json.loads(os.environ['MATRIX'])['include']))")
          got=$(ls raw-tennis/*.json.gz 2>/dev/null | wc -l)
          echo "Tennis extracts: $got of $expected regions"
          if [ "$got" -eq "$expected" ]; then echo "TENNIS_COMPLETE=yes" >> "$GITHUB_ENV"; else echo "::warning::Tennis extracts missing for $((expected - got)) regions: not publishing tennis."; fi
      - name: Build
        run: python -m tennis_catalogue.build raw-tennis out-tennis
      - name: Check against the live build
        run: |
          curl -fsSL -o previous.json https://data.lyjaapp.eu/tennis/v1/manifest.json || rm -f previous.json
          python -m tennis_catalogue.guard out-tennis/stats.json --previous previous.json
      - name: Summary
        if: always()
        run: |
          [ -f out-tennis/stats.json ] || exit 0
          python -m tennis_catalogue.summary out-tennis >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-report
          path: |
            out-tennis/stats.json
            out-tennis/build-log.json
            out-tennis/later/
          retention-days: 90
      - name: Publish to R2
        if: inputs.only == '' && inputs.publish != false && env.TENNIS_COMPLETE == 'yes'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'lyja-golf' }}
          BUILD_ID: ${{ inputs.tennis_from_run != '' && inputs.tennis_build_id || '' }}
        run: |
          tar -czf ../tennis-catalogue.tar.gz --exclude='./raw' --exclude='./raw-tennis' --exclude='./out' --exclude='./out-tennis' --exclude='__pycache__' --exclude='./.git' .
          python -m tennis_catalogue.publish out-tennis --tools ../tennis-catalogue.tar.gz ${BUILD_ID:+--build-id "$BUILD_ID"}
