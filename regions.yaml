# Geofabrik extracts the golf catalogue is built from.
# URL: https://download.geofabrik.de/{path}-latest.osm.pbf (and .md5).
# `country` is ISO 3166-1 alpha-2; extracts holding two countries are split
# in golf_catalogue/countries.py. Add a line to cover another region.
